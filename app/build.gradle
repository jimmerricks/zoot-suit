plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

// Per-machine secrets and identity settings, never committed (see
// docs/release-identity.md): apikeys.properties next to settings.gradle, else
// environment variables of the same names in upper case (for CI). Every key is
// optional; a build without them works, but OAuth sign-in and crash reports don't.
def apikeyPropertiesFile = rootProject.file("apikeys.properties")
def apikeyProperties = new Properties()
if (apikeyPropertiesFile.exists()) {
    apikeyPropertiesFile.withInputStream { apikeyProperties.load(it) }
}
def localSetting = { String key ->
    def value = apikeyProperties.getProperty(key) ?: System.getenv(key.toUpperCase()) ?: ""
    value = value.trim()
    // the file's values are quoted Java string literals ("..."); env values aren't
    value.startsWith('"') ? value : "\"${value}\""
}

// Release signing (docs/release-identity.md): keystore.properties next to settings.gradle,
// else the file named by $KEYSTORE_PROPERTIES (the Docker build mounts it). Keys: storeFile,
// storePassword, keyAlias, keyPassword. Without it, assembleRelease gives an unsigned APK.
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (!keystorePropertiesFile.exists() && System.getenv("KEYSTORE_PROPERTIES")) {
    keystorePropertiesFile = file(System.getenv("KEYSTORE_PROPERTIES"))
}
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    compileSdkVersion 36
    signingConfigs {
        if (keystoreProperties.getProperty("storeFile")) {
            release {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }
    defaultConfig {
        // our own id (namespace and Kotlin packages keep upstream's): installs beside
        // Zoo for Zotero rather than over it. se.jmwhite since 0.2.0 (0.1.0 was nu.n4).
        applicationId "se.jmwhite.zootsuit"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 13
        versionName "0.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "zotero_api_key", localSetting("zotero_api_key"))
        buildConfigField("String", "zotero_api_secret", localSetting("zotero_api_secret"))
    }
    buildTypes {
        // beside a release build on the same device: different keys can't update each other
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (keystoreProperties.getProperty("storeFile")) {
                signingConfig signingConfigs.release
            }
            // R8 shrinks the libraries (Material, AndroidX, OkHttp): 18 MB -> ~2.6 MB.
            // The app's own classes are all kept (proguard-rules.pro): Gson, Room and
            // Retrofit reach them by reflection.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
    }
    
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
        // android.util.Log etc. return defaults instead of throwing (ZoteroAPI logs)
        unitTests.returnDefaultValues = true
    }
    
    // the app is English only; the libraries' ~100 translations are dead weight
    androidResources {
        localeFilters += ['en']
    }

    namespace 'com.mickstarify.zooforzotero'
}

dependencies {

    // MAIN DEPENDENCIES
    
    // Core Android dependencies
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.activity:activity-ktx:1.10.1'

    // Networking
    implementation('com.squareup.okhttp3:okhttp:4.12.0')
    implementation('com.squareup.okhttp3:logging-interceptor:4.12.0')
    implementation 'oauth.signpost:oauth-signpost:2.1.1'
    implementation('oauth.signpost:signpost-commonshttp4:2.1.1') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.squareup.retrofit2:retrofit:2.9.0')
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // converter-gson brings Gson 2.8.5: CVE-2022-25647 (a crafted JSON exhausts the stack)
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation "io.github.rburgst:okhttp-digest:3.1.1"

    // Room Dependencies
    implementation "androidx.room:room-runtime:2.7.2"
    implementation 'androidx.room:room-rxjava3:2.7.2'
    ksp "androidx.room:room-compiler:2.7.2"

    // Dependency Injection
    implementation "com.google.dagger:hilt-android:2.57"
    ksp "com.google.dagger:hilt-compiler:2.57"

    // Bulk attachment downloads in the background, carried on after the app is stopped
    implementation 'androidx.work:work-runtime-ktx:2.10.1'

//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.7'

    // TEST DEPENDENCIES

    // Unit Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    // Pin the launcher to match jupiter 5.13.x (platform 1.13.x); Gradle 8.13
    // otherwise supplies an older launcher and Jupiter fails to discover tests.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    testImplementation 'junit:junit:4.13.2'
    // Vintage engine so the existing JUnit4 model tests also run under the
    // JUnit Platform; without it useJUnitPlatform() silently skips them.
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.13.4'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.0.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'app.cash.turbine:turbine:1.2.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Instrumented Testing
    androidTestImplementation 'org.mockito:mockito-android:5.18.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'

}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

// the exported schemas, for MigrationTestHelper in instrumented tests
android.sourceSets.androidTest.assets.srcDirs += files("$projectDir/schemas")
